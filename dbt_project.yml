name: 'automated_datavault'
version: '1.0'
profile: 'default'
config-version: 2

model-paths: ["models"]

analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  automated_datavault:
    +materialized: incremental
    +file_format: delta
    +incremental_strategy: merge
    +on_schema_change: sync_all_columns
