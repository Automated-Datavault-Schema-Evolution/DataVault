configs:
  hive-site.xml:
    file: ./hive-site.xml

services:
  datavault-ingestion-app:
    user: "1001:1001"
    build:
      context: .
      dockerfile: Dockerfile
      ssh:
        - default
    container_name: DatavaultIngestionHandler
    env_file: .env.docker
    volumes:
      - ./:/app
      - ${HOST_DATA_DIRECTORY}:${CONTAINER_DATA_DIR}
      - /var/run/docker.sock:/var/run/docker.sock
      - delta-jars:/opt/delta-jars:ro
      - ext-jars:/opt/ext-jars:ro
      - jdbc-driver:/opt/jdbc-jars:ro
      - ./hive-site.xml:/opt/spark/conf/hive-site.xml:ro
    networks:
      - data-automation-net
    environment:
      - SSH_AUTH_SOCK=/ssh-agent
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - UMASK=0002
      - SPARK_WORKER_OPTS=-Dspark.hadoop.fs.permissions.umask-mode=002 -Dspark.shuffle.service.enabled=true
      - HOME=/tmp
      - SPARK_IVY_PATH=/tmp/.ivy2
      - CHECKPOINT_PATH=${CHECKPOINT_PATH}            # -> /data/checkpoints
      - SPARK_SQL_WAREHOUSE_DIR=${CONTAINER_WAREHOUSE_DIR}  # -> /data/spark/warehouse
    restart: unless-stopped
    ports:
      - "4042:4042"
    stop_grace_period: 90s
    depends_on:
      datavault-ingestion-spark-master:
        condition: service_healthy
      datavault-ingestion-spark-thrift:
        condition: service_healthy
      warehouse-init:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      - traefik.http.routers.dv-app.rule=PathPrefix(`/spark/dv/app`)
      - traefik.http.services.dv-app.loadbalancer.server.port=4042
      - traefik.http.middlewares.dv-app-strip.stripprefix.prefixes=/spark/dv/app
      - traefik.http.routers.dv-app.middlewares=dv-app-strip


  datavault-ingestion-spark-master:
    # user: "1001:1001"
    user: "0:0"
    image: apache/spark:3.5.6
    container_name: datavault-ingestion-spark-master
    depends_on:
      hive-jars-init:
        condition: service_completed_successfully
      hive-metastore:
        condition: service_healthy
      warehouse-init:
        condition: service_completed_successfully
    environment:
      - SPARK_MASTER_PORT=7078
      - SPARK_MASTER_WEBUI_PORT=8090
      - KAFKA_BOOTSTRAP_SERVER=kafka:9092
      - SPARK_CLASSPATH=/opt/delta-jars/*:/opt/ext-jars/*
      - UMASK=0002
      - SPARK_MASTER_OPTS=-Dspark.hadoop.fs.permissions.umask-mode=002
      - SPARK_NO_DAEMONIZE=1
      - SPARK_LOG_DIR=/tmp/spark/logs
      - SPARK_PID_DIR=/tmp/spark/pids
    command:
      - /bin/bash
      - -lc
      - >
        set -Eeuo pipefail;
        /opt/spark/sbin/start-master.sh
        -h datavault-ingestion-spark-master
        -p "${SPARK_MASTER_PORT:-7078}"
        --webui-port "${SPARK_MASTER_WEBUI_PORT:-8090}";
        tail -F /opt/spark/logs/* &
        wait -n
    volumes:
      - ${HOST_DATA_DIRECTORY}:${CONTAINER_DATA_DIR}
      - ${HOST_SPARK_WAREHOUSE_DIR}:${CONTAINER_WAREHOUSE_DIR}
      - hive-313-jars:/opt/hive-3.1.3-lib:ro
      - ./hive-site.xml:/opt/spark/conf/hive-site.xml:ro
      - delta-jars:/opt/delta-jars:ro
      - ext-jars:/opt/ext-jars:ro
    ports:
      - "7078:7078"
      - "8090:8090"
    networks: [ data-automation-net ]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8090 && exec 3>&- 3<&- || exit 1'" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  datavault-ingestion-spark-worker-1:
    # user: "1001:1001"
    user: "0:0"
    image: apache/spark:3.5.6
    container_name: datavault-ingestion-spark-worker-1
    depends_on:
      datavault-ingestion-spark-master:
        condition: service_healthy
      hive-jars-init:
        condition: service_completed_successfully
      warehouse-init:
        condition: service_completed_successfully
    environment:
      - SPARK_WORKER_MEMORY=8g
      - SPARK_WORKER_CORES=6
      - SPARK_WORKER_WEBUI_PORT=8091
      - KAFKA_BOOTSTRAP_SERVER=kafka:9092
      - SPARK_CLASSPATH=/opt/delta-jars/*:/opt/ext-jars/*
      - UMASK=0002
      - SPARK_WORKER_OPTS=-Dspark.hadoop.fs.permissions.umask-mode=002
      - SPARK_NO_DAEMONIZE=1
      - SPARK_LOG_DIR=/tmp/spark/logs
      - SPARK_PID_DIR=/tmp/spark/pids
    # platform: linux/amd64
    command:
      - /bin/bash
      - -lc
      - >
        set -Eeuo pipefail;
        /opt/spark/sbin/start-worker.sh
        --webui-port "${SPARK_WORKER_WEBUI_PORT:-8091}"
        -c "${SPARK_WORKER_CORES:-4}"
        -m "${SPARK_WORKER_MEMORY:-4g}"
        spark://datavault-ingestion-spark-master:7078;
        tail -F /opt/spark/logs/* &
        wait -n
    volumes:
      - ${HOST_DATA_DIRECTORY}:${CONTAINER_DATA_DIR}
      - ${HOST_SPARK_WAREHOUSE_DIR}:${CONTAINER_WAREHOUSE_DIR}
      - hive-313-jars:/opt/hive-3.1.3-lib:ro
      - ./hive-site.xml:/opt/spark/conf/hive-site.xml:ro
      - delta-jars:/opt/delta-jars:ro
      - ext-jars:/opt/ext-jars:ro
    ports: [ "8091:8091" ]
    networks: [ data-automation-net ]
    healthcheck:
      test: [ "CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8091 && exec 3>&- 3<&- || exit 1'" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

