services:
  datavault-ingestion-app:
    build:
      context: .
      dockerfile: Dockerfile
      ssh:
        - default
    container_name: DatavaultIngestionHandler
    env_file: .env.docker
    volumes:
      - ./:/app
      - ${HOST_DATA_DIRECTORY}:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - data_automation-net
    environment:
      - SSH_AUTH_SOCK=/ssh-agent
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092 #change hardcoded variable, to dynamic from env-file (currently hardcoded, as it would use localhost:9092 in docker)
    restart: unless-stopped

  datavault-ingestion-spark-master:
    image: ${SPARK_WORKER_IMAGE}
    container_name: datavault-ingestion-spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_PORT=7078
      - SPARK_MASTER_WEBUI_PORT=8081
      - KAFKA_BOOTSTRAP_SERVER=kafka:9092
    ports:
      - "7078:7078"
      - "8081:8081"
      - "4041:4041"
    networks:
      - data_automation-net
    restart: unless-stopped

  datavault-ingestion-spark-worker-1:
    image: ${SPARK_WORKER_IMAGE}
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://datavault-ingestion-spark-master:7078
      - SPARK_WORKER_MEMORY=${SPARK_EXECUTOR_MEMORY}
      - SPARK_WORKER_CORES=${SPARK_EXECUTOR_CORES}
      - SPARK_WORKER_WEBUI_PORT=8084
      - KAFKA_BOOTSTRAP_SERVER=kafka:9092
    depends_on:
      - datavault-ingestion-spark-master
    ports:
      - "8084:8084"
    networks:
      - data_automation-net

  datavault-ingestion-spark-worker-2:
    image: ${SPARK_WORKER_IMAGE}
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://datavault-ingestion-spark-master:7078
      - SPARK_WORKER_MEMORY=${SPARK_EXECUTOR_MEMORY}
      - SPARK_WORKER_CORES=${SPARK_EXECUTOR_CORES}
      - SPARK_WORKER_WEBUI_PORT=8085
      - KAFKA_BOOTSTRAP_SERVER=kafka:9092
    depends_on:
      - datavault-ingestion-spark-master
    ports:
      - "8085:8085"
    networks:
      - data_automation-net

  datavault-ingestion-spark-thrift:
    image: apache/spark:3.5.6
    container_name: datavault-ingestion-spark-thrift
    entrypoint: /opt/spark/sbin/start-thriftserver.sh
    command: [
      "--master", "spark://datavault-ingestion-spark-master:7078",
      "--hiveconf", "hive.server2.thrift.port=7079"
    ]
    environment:
      - SPARK_NO_DAEMONIZE=true
    depends_on:
      - datavault-ingestion-spark-master
    ports:
      - "7079:7079"
    networks:
      - data_automation-net
    restart: unless-stopped

networks:
  data_automation-net:
    external: true