configs:
  hive-site.xml:
    file: ./hive-site.xml

services:
  datavault-ingestion-app:
    build:
      context: .
      dockerfile: Dockerfile
      ssh:
        - default
    container_name: DatavaultIngestionHandler
    env_file: .env.docker
    volumes:
      - ./:/app
      - ${HOST_DATA_DIRECTORY}:${CONTAINER_DATA_DIR}
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - data_automation-net
    environment:
      - SSH_AUTH_SOCK=/ssh-agent
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092 #change hardcoded variable, to dynamic from env-file (currently hardcoded, as it would use localhost:9092 in docker)
    restart: unless-stopped
    depends_on:
      datavault-ingestion-spark-master:
        condition: service_healthy
      datavault-ingestion-spark-thrift:
        condition: service_healthy


  datavault-ingestion-spark-master:
    image: ${SPARK_WORKER_IMAGE}
    container_name: datavault-ingestion-spark-master
    depends_on:
      hive-jars-init:
        condition: service_started
      hive-metastore:
        condition: service_healthy
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_PORT=7078
      - SPARK_MASTER_WEBUI_PORT=8081
      - KAFKA_BOOTSTRAP_SERVER=kafka:9092
    volumes:
      - ${HOST_DATA_DIRECTORY}:/data
      - hive-313-jars:/opt/hive-3.1.3-lib:ro
      - ./hive-site.xml:/opt/spark/conf/hive-site.xml:ro
    ports:
      - "7078:7078"
      - "8081:8081"
      - "4041:4041"
    networks: [ data_automation-net ]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8081/ > /dev/null || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  datavault-ingestion-spark-worker-1:
    # image: apache/spark:3.5.6
    image: ${SPARK_WORKER_IMAGE}
    container_name: datavault-ingestion-spark-worker-1
    depends_on:
      datavault-ingestion-spark-master:
        condition: service_healthy
      hive-jars-init:
        condition: service_started
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://datavault-ingestion-spark-master:7078
      - SPARK_WORKER_MEMORY=${SPARK_EXECUTOR_MEMORY}
      - SPARK_WORKER_CORES=${SPARK_EXECUTOR_CORES}
      - SPARK_WORKER_WEBUI_PORT=8084
      - KAFKA_BOOTSTRAP_SERVER=kafka:9092
    volumes:
      - ${HOST_DATA_DIRECTORY}:${CONTAINER_DATA_DIR}
      - hive-313-jars:/opt/hive-3.1.3-lib:ro
      - ./hive-site.xml:/opt/spark/conf/hive-site.xml:ro
    ports: [ "8084:8084" ]
    networks: [ data_automation-net ]
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8084/ > /dev/null || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  datavault-ingestion-spark-worker-2:
    image: ${SPARK_WORKER_IMAGE}
    container_name: datavault-ingestion-spark-worker-2
    depends_on:
      datavault-ingestion-spark-master:
        condition: service_healthy
      hive-jars-init:
        condition: service_started
    # command: >
    #   bash -lc "
    #     /opt/spark/sbin/start-worker.sh
    #       spark://datavault-ingestion-spark-master:7078
    #       --webui-port 8085
    #       --cores ${SPARK_EXECUTOR_CORES}
    #       --memory ${SPARK_EXECUTOR_MEMORY}
    #     && tail -f /opt/spark/logs/*"
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://datavault-ingestion-spark-master:7078
      - SPARK_WORKER_MEMORY=${SPARK_EXECUTOR_MEMORY}
      - SPARK_WORKER_CORES=${SPARK_EXECUTOR_CORES}
      - SPARK_WORKER_WEBUI_PORT=8085
      - KAFKA_BOOTSTRAP_SERVER=kafka:9092
    volumes:
      - ${HOST_DATA_DIRECTORY}:${CONTAINER_DATA_DIR}
      - hive-313-jars:/opt/hive-3.1.3-lib:ro
      - ./hive-site.xml:/opt/spark/conf/hive-site.xml:ro
    ports: [ "8085:8085" ]
    networks: [ data_automation-net ]
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8085/ > /dev/null || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s


  datavault-ingestion-spark-thrift:
    image: apache/spark:3.5.6
    container_name: datavault-ingestion-spark-thrift
    depends_on:
      datavault-ingestion-spark-master:
        condition: service_healthy
      datavault-ingestion-spark-worker-1:
        condition: service_healthy
      datavault-ingestion-spark-worker-2:
        condition: service_healthy
      hive-jars-init:
        condition: service_started
      hive-metastore:
        condition: service_healthy
    command: >
      bash -lc "
        /opt/spark/sbin/start-thriftserver.sh
          --master spark://datavault-ingestion-spark-master:7078
          --hiveconf hive.server2.thrift.bind.host=0.0.0.0
          --hiveconf hive.server2.thrift.port=10000
          --conf spark.sql.catalogImplementation=hive
          --conf spark.sql.warehouse.dir=/data/spark/warehouse
          --conf spark.sql.hive.metastore.uris=thrift://hive-metastore:9083
          --conf spark.sql.hive.metastore.version=3.1.3
          --conf spark.sql.hive.metastore.jars=/opt/hive-3.1.3-lib/*
          --conf spark.ui.enabled=false
        && tail -f /opt/spark/logs/*"
    environment:
      - SPARK_NO_DAEMONIZE=true
      - CONTAINER_DATA_DIR=${CONTAINER_DATA_DIR}
      - CONTAINER_WAREHOUSE_DIR=${CONTAINER_WAREHOUSE_DIR}
    volumes:
      - ${HOST_DATA_DIRECTORY}:${CONTAINER_DATA_DIR}
      - ${HOST_SPARK_WAREHOUSE_DIR}:${CONTAINER_SPARK_WAREHOUSE_DIR}
      - hive-313-jars:/opt/hive-3.1.3-lib:ro
      - ./hive-site.xml:/opt/spark/conf/hive-site.xml:ro
    ports: [ "10000:10000" ]
    networks: [ data_automation-net ]
    healthcheck:
      test: [ "CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/10000 && exec 3>&- 3<&- || exit 1'" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s


  hive-jars-init:
    image: apache/hive:3.1.3
    user: "0"
    container_name: hive-jars-init
    entrypoint:
      - /bin/bash
      - -lc
      - |
        set -Eeuo pipefail
        rm -rf /hive-jars/*
        cp -a /opt/hive/lib/* /hive-jars/
        touch /hive-jars/.ready
        sleep infinity
    volumes:
      - hive-313-jars:/hive-jars
    networks: [ data_automation-net ]

  jdbc-driver-init:
    image: curlimages/curl:8.10.1
    user: "0"
    entrypoint:
      - sh
      - -lc
      - >
        set -Eeuo pipefail; mkdir -p /out;
        curl -fL --retry 5 --retry-all-errors
        -o /out/postgresql-42.7.4.jar
        https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar;
        ls -l /out
    volumes:
      - jdbc-driver:/out
    networks: [ data_automation-net ]

  metastore-db-init:
    image: postgres:latest
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      METASTORE_DB: ${METASTORE_DB}
      METASTORE_DB_USER: ${METASTORE_DB_USER}
      METASTORE_DB_PASSWORD: ${METASTORE_DB_PASSWORD}
      METASTORE_DB_RESET: ${METASTORE_DB_RESET}
    entrypoint:
      - sh
      - -lc
      - >
        set -eu;
        until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"; do sleep 2; done;
        if [ "${METASTORE_DB_RESET}" = "true" ]; then
          psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres \
            -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='${METASTORE_DB}'";
          psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres \
            -c "DROP DATABASE IF EXISTS \"${METASTORE_DB}\"";
        fi;
        psql -Atqc "SELECT 1 FROM pg_roles WHERE rolname='${METASTORE_DB_USER}'" | grep -q 1 \
          || psql -c "CREATE ROLE \"${METASTORE_DB_USER}\" LOGIN PASSWORD '${METASTORE_DB_PASSWORD}'";
        psql -Atqc "SELECT 1 FROM pg_database WHERE datname='${METASTORE_DB}'" | grep -q 1 \
          || psql -c "CREATE DATABASE \"${METASTORE_DB}\" OWNER \"${METASTORE_DB_USER}\" ENCODING 'UTF8'";
        psql -d "${METASTORE_DB}" -c "ALTER SCHEMA public OWNER TO \"${METASTORE_DB_USER}\"; GRANT ALL ON SCHEMA public TO \"${METASTORE_DB_USER}\";"
    networks: [ data_automation-net ]
    restart: "no"

  hive-schema-init:
    image: apache/hive:3.1.3
    user: "0"
    entrypoint:
      - /bin/bash
      - -lc
      - >
        set -Eeuo pipefail;
        rm -f /opt/hive/lib/postgresql-*.jar || true;
        export HIVE_AUX_JARS_PATH="/opt/hive/extra-jars/postgresql-42.7.4.jar";
        export HADOOP_CLASSPATH="/opt/hive/extra-jars/postgresql-42.7.4.jar:${HADOOP_CLASSPATH-}";
        /opt/hive/bin/schematool -initSchema -dbType postgres -driver org.postgresql.Driver \
          -userName "${METASTORE_DB_USER}" -passWord "${METASTORE_DB_PASSWORD}" \
          -url "jdbc:postgresql://postgres:5432/${METASTORE_DB}?currentSchema=public" --verbose
    depends_on:
      jdbc-driver-init:
        condition: service_completed_successfully
      metastore-db-init:
        condition: service_completed_successfully
    volumes:
      - jdbc-driver:/opt/hive/extra-jars:ro
      - ./hive-site.xml:/opt/hive/conf/hive-site.xml:ro
    networks: [ data_automation-net ]

  hive-metastore:
    image: apache/hive:3.1.3
    user: "0"
    environment:
      METASTORE_DB: ${METASTORE_DB}
      METASTORE_DB_USER: ${METASTORE_DB_USER}
      METASTORE_DB_PASSWORD: ${METASTORE_DB_PASSWORD}
    entrypoint:
      - /bin/bash
      - -lc
      - >
        set -Eeuo pipefail;
        echo "[preflight] ensuring modern postgres driver";
        rm -f /opt/hive/lib/postgresql-*.jar || true;
        export HIVE_AUX_JARS_PATH="/opt/hive/extra-jars/postgresql-42.7.4.jar";
        export HADOOP_CLASSPATH="/opt/hive/extra-jars/postgresql-42.7.4.jar:${HADOOP_CLASSPATH-}";
        echo "[preflight] checking metastore schema via schematool -info";
        /opt/hive/bin/schematool -dbType postgres -driver org.postgresql.Driver \
          -userName "${METASTORE_DB_USER}" -passWord "${METASTORE_DB_PASSWORD}" \
          -url "jdbc:postgresql://postgres:5432/${METASTORE_DB}?currentSchema=public" -info -verbose;
        echo "[start] launching Hive Metastore on :9083";
        exec /opt/hive/bin/hive --service metastore -p 9083 \
          --hiveconf javax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/${METASTORE_DB}?currentSchema=public \
          --hiveconf javax.jdo.option.ConnectionUserName=${METASTORE_DB_USER} \
          --hiveconf javax.jdo.option.ConnectionPassword=${METASTORE_DB_PASSWORD} \
          --hiveconf javax.jdo.option.ConnectionDriverName=org.postgresql.Driver \
          --hiveconf hive.metastore.schema.verification=true \
          --hiveconf hive.root.logger=INFO,console
    volumes:
      - ./hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - jdbc-driver:/opt/hive/extra-jars:ro
    depends_on:
      hive-schema-init:
        condition: service_completed_successfully
    # Healthcheck without nc (uses bash's /dev/tcp)
    healthcheck:
      test: [ "CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/9083 && exec 3>&- 3<&- || exit 1'" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    ports: [ "9083:9083" ]
    networks: [ data_automation-net ]
    restart: unless-stopped



volumes:
  # spark-warehouse:
  hive-313-jars: {}
  ext-jars:
  jdbc-driver: {}

networks:
  data_automation-net:
    external: true