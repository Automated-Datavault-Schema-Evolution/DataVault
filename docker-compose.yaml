      - SPARK_WORKER_WEBUI_PORT=8094
      - KAFKA_BOOTSTRAP_SERVER=kafka:9092
      - SPARK_CLASSPATH=/opt/delta-jars/*:/opt/ext-jars/*
      - UMASK=0002
      - SPARK_WORKER_OPTS=-Dspark.hadoop.fs.permissions.umask-mode=002 -Dspark.shuffle.service.enabled=true
      - SPARK_NO_DAEMONIZE=1
      - SPARK_LOG_DIR=/tmp/spark/logs
